<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avocado Co. - AR Product</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
 
    AFRAME.registerComponent('color-changer', {
      init: function () {
        const colors = ['#EF2D5E', '#FFC65D', '#4CC3D9', '#7BC8A4', '#9B59B6'];
        let index = 0;
        this.el.addEventListener('click', () => {
          index = (index + 1) % colors.length;
          this.el.setAttribute('color', colors[index]);
        });
      }
    });

   
    AFRAME.registerComponent('grow-toggle', {
      schema: {
        target: { type: 'selector' },
        big: { type: 'number', default: 1.8 }
      },
      init: function () {
        let open = false;
        this.el.addEventListener('click', () => {
          open = !open;
          const s = open ? this.data.big : 1;
          this.el.setAttribute('scale', s + ' ' + s + ' ' + s);
          if (this.data.target) {
            this.data.target.setAttribute('visible', open);
          }
        });
      }
    });

    
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.querySelector('#status');
        this.el.addEventListener('markerFound', () => {
          banner.textContent = 'Marker FOUND - Tap the ball and green cube!';
          banner.style.background = '#2E7D32';
        });
        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Marker LOST - Point camera at Hiro marker';
          banner.style.background = '#C62828';
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    
    #arjs-video { position: fixed !important; top: 0; left: 0; width: 100% !important; height: 100% !important; object-fit: cover; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      padding: 10px; text-align: center; color: white;
      font-family: sans-serif; background: #C62828;
    }
  </style>
</head>

<body>
  <div id="status">Looking for marker...</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; trackingMethod: best; debugUIEnabled: false;"
           renderer="antialias: true; alpha: true; precision: medium;">

    <a-assets timeout="20000">
      <a-asset-item id="avocado-model"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb">
      </a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-status>

      
      <a-plane rotation="-90 0 0" width="1.6" height="1.6" color="#1B4332"></a-plane>

      
      <a-cylinder position="0 0.1 0" radius="0.35" height="0.2" color="#D8F3DC"></a-cylinder>

      
      <a-entity gltf-model="#avocado-model" position="0 0.2 0" scale="6 6 6"
                animation="property: rotation; to: 0 360 0; dur: 9000; easing: linear; loop: true"></a-entity>

      
      <a-torus position="0 0.55 0" rotation="90 0 0" radius="0.5" radius-tubular="0.012"
               color="#FFC65D"
               animation="property: rotation; to: 90 0 360; dur: 6000; easing: linear; loop: true"></a-torus>

      
      <a-sphere class="clickable" color-changer
                position="0.6 0.5 0.4" radius="0.15" color="#EF2D5E"
                animation="property: position; from: 0.6 0.35 0.4; to: 0.6 0.75 0.4; dir: alternate; dur: 700; easing: easeInOutQuad; loop: true"></a-sphere>

      
      <a-box class="clickable" grow-toggle="target: #fact"
             position="-0.6 0.15 0.4" width="0.3" height="0.3" depth="0.3"
             color="#7BC8A4"></a-box>

      
      <a-text id="fact" visible="false" value="Avocados are technically berries!"
              position="0 1.25 0" align="center" width="2.4" color="#FFC65D"></a-text>

      
      <a-text position="-0.55 1.05 0.65"
              color="#FFFFFF" align="center" width="2.5" side="double"></a-text>

      
      <a-entity position="0.55 0 -0.45">
        <a-cylinder position="0 0.2 0" radius="0.06" height="0.4" color="#8B5A2B"></a-cylinder>
        <a-sphere position="0 0.65 0" radius="0.3" color="#4CAF50"></a-sphere>
      </a-entity>

      
      <a-text position="0 1.6 0" align="center"
              width="3" color="#FFFFFF"></a-text>

    </a-marker>

    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

  </a-scene>
</body>
</html>
